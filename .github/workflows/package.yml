# Builds the Windows and Linux install packages.
# - Every push to a branch: zips are attached to the workflow run (Actions tab > run > Artifacts).
# - Pushing a tag like v1.0.0: zips are also published as a GitHub Release.
name: Package

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build web client
        working-directory: client
        run: npm ci && npm run build
      - name: Build Windows package
        run: MANAGEY_SKIP_CLIENT=1 ./scripts/publish.sh win-x64
      - name: Build Linux package
        run: MANAGEY_SKIP_CLIENT=1 ./scripts/publish.sh linux-x64

      - uses: actions/upload-artifact@v4
        with:
          name: Managey-packages
          path: publish/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    # Only this job may write to the repository, and only for tags.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Managey-packages
      - uses: softprops/action-gh-release@v2
        with:
          files: '*.zip'
